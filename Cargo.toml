[package]
name = "openlaunch-connect"
version = "1.2.0"
edition = "2024"
rust-version = "1.94"
description = "Open-source macOS bridge: Garmin Approach R10 (Bluetooth LE) -> GSPro OpenConnect API"
repository = "https://github.com/chgl42/golfsim-connect"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "openlaunch"
path = "src/main.rs"

[[bin]]
name = "openlaunch-connect"
path = "src/bin/openlaunch-connect/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
# The desktop app (`openlaunch_connect::ui`: egui/eframe, AppKit windows). The CLI builds without
# it: `cargo build --bin openlaunch --no-default-features`.
gui = [
    "dep:eframe",
    "dep:image",
    "dep:rfd",
    "dep:objc2",
    "dep:block2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:objc2-core-graphics",
    "dep:objc2-core-foundation",
]

[dependencies]
tenover = { path = "vendor/tenover" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.35.0", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
sys-locale = "0.3.2"
ureq = "3"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, optional = true, features = ["std", "NSApplication", "NSWindow", "NSResponder", "NSScreen", "NSEvent", "NSWorkspace", "NSRunningApplication", "libc", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, optional = true, features = ["std", "NSString", "NSArray", "NSGeometry", "NSNotification", "NSOperation", "NSDictionary", "NSValue", "NSTimer", "NSDate", "block2"] }
objc2-core-graphics = { version = "0.3", default-features = false, optional = true, features = ["std", "CGWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, optional = true, features = ["std", "CFArray"] }
rfd = { version = "0.17.2", optional = true }

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["wgpu", "snapshot", "eframe"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

# Pedantic is on; the allows below are a ratchet baseline: each lint that fired when this was set up,
# with its count then. To pay one down: remove the line, fix what `cargo clippy --all-targets` reports
# (or `#[expect(…, reason = "…")]` where the code is right as it is), and never add new entries.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
allow_attributes = "warn"
dbg_macro = "warn"
doc_markdown = "allow"                          # 151
cast_precision_loss = "allow"                   # 61
cast_possible_truncation = "allow"              # 51
many_single_char_names = "allow"                # 16
cast_sign_loss = "allow"                        # 15
struct_field_names = "allow"                    # 12
match_same_arms = "allow"                       # 8
too_many_lines = "allow"                        # 8
missing_panics_doc = "allow"                    # 6
struct_excessive_bools = "allow"                # 5
format_push_string = "allow"                    # 3
option_option = "allow"                         # 3
single_match_else = "allow"                     # 3
unchecked_time_subtraction = "allow"            # 3
assert_is_empty = "allow"                       # 2
items_after_statements = "allow"                # 2
needless_pass_by_value = "allow"                # 2
similar_names = "allow"                         # 2
wildcard_imports = "allow"                      # 2
bool_to_int_with_if = "allow"                   # 1
case_sensitive_file_extension_comparisons = "allow" # 1
missing_errors_doc = "allow"                    # 1
