# Lizenzen, die für Abhängigkeiten akzeptiert werden (cargo-about).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "0BSD",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Mozilla's root certificates (webpki-roots, via ureq/rustls for the update check)
    "CDLA-Permissive-2.0",
]
targets = ["aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
