name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIP: OpenLaunch-Connect-macos-arm64.zip

jobs:
  build:
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Tests
        run: cargo test --all-targets

      - name: Build "OpenLaunch Connect.app"
        run: ./make-app.sh

      - name: Package
        run: |
          cd target
          ditto -c -k --keepParent "OpenLaunch Connect.app" "$ZIP"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLaunch-Connect-macos-arm64
          path: |
            target/${{ env.ZIP }}
            target/THIRD_PARTY_LICENSES.html

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: this version's section of CHANGELOG.md (falls back to GitHub's generated notes).
          # A tag with a suffix (v1.2.0-rc.1) is a release candidate: published as a pre-release, which the
          # app's update check (releases/latest) doesn't offer, with the [Unreleased] notes until the
          # version has its own section.
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="${VERSION%%-*}"
          section() { awk -v v="$1" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && (/^## \[/ || /^\[[^]]*\]: /) {exit} on' CHANGELOG.md; }
          section "$BASE" > notes.md
          PRE=()
          if [ "$VERSION" != "$BASE" ]; then
            PRE=(--prerelease)
            [ -s notes.md ] || section "Unreleased" > notes.md
          fi
          if [ -s notes.md ]; then NOTES=(--notes-file notes.md); else NOTES=(--generate-notes); fi
          gh release create "${GITHUB_REF_NAME}" "target/$ZIP" target/THIRD_PARTY_LICENSES.html \
            --title "OpenLaunch Connect ${GITHUB_REF_NAME}" "${NOTES[@]}" "${PRE[@]}"
